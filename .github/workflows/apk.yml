name: Android APK

# Builds the Android app from the same code as the web preview and puts it on the
# Releases page: https://github.com/<owner>/book-mart/releases/tag/apk-latest

# Built only when started by hand (Actions → Android APK → Run workflow), after the preview is checked.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm install --no-audit --no-fund
      - run: npm run build

      - name: Create the Android project
        run: npx cap add android

      - name: App icon, camera permission, version number
        run: |
          cp -r resources/android/res/. android/app/src/main/res/
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' $M
          VERSION=$(node -p 'require("./package.json").version')
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION (${{ github.run_number }})\"/" $G
          grep -n "permission" $M || true
          grep -n "versionCode\|versionName" $G || true

      - run: npx cap sync android

      # The same signing key must be used for every build, otherwise a new APK will not
      # install over the old one. It comes from the repository secrets ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASS.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::Add the repository secrets ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASS (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > keystore/release.jks
          printf '%s' "$KEYSTORE_PASS" | tr -d ' \r\n' > keystore/pass
          keytool -list -keystore keystore/release.jks -storepass "$(cat keystore/pass)" > /dev/null || { echo "::error::The keystore secret or its password is wrong."; exit 1; }

      - name: Build
        run: cd android && ./gradlew assembleRelease --no-daemon -q

      - name: Sign
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PASS=$(cat keystore/pass)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks keystore/release.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out book-mart.apk aligned.apk
          "$BT/apksigner" verify --print-certs book-mart.apk | grep -i "sha-256" | tee cert.txt
          echo "::notice::Signed with $(cat cert.txt)"
          ls -la book-mart.apk

      - uses: actions/upload-artifact@v4
        with:
          name: book-mart-apk
          path: book-mart.apk

      - name: Put the APK on the Releases page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest book-mart.apk \
            --target "${{ github.sha }}" \
            --title "Book Mart Android app (build ${{ github.run_number }})" \
            --notes "Download book-mart.apk on the phone and open it to install. Built from ${{ github.sha }}." \
            --latest
